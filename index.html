<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge and Torch</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #2b2147;
            --sky-mid: #533666;
            --sky-bottom: #834e7c;
            --city-back: #633d6e;
            --city-mid: #3c264f;
            --city-front: #211430;
            --ledge-color: #160c21;
            --moon-base: #b887ab;
            --moon-crater: #9b6c92;
            --pill-bg: rgba(25, 16, 38, 0.65);
            --pill-border: rgba(255, 255, 255, 0.14);
            --text-main: #f8f2fa;
            --text-muted: #cbbad4;
            --accent-warm: #ffcf7c;
            --accent-pink: #ff8da1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-bottom) 100%);
            color: var(--text-main);
        }

        /* ==========================================
           FULL-SCREEN ANIMATED URBAN TWILIGHT SCENE
           ========================================== */
        .world-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Twinkling Stars & Shooting Stars */
        .sky-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .star-dot {
            position: absolute;
            border-radius: 50%;
            animation: pulseStar var(--dur, 4s) infinite ease-in-out;
        }
        @keyframes pulseStar {
            0%, 100% { opacity: 0.25; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        .shooting-star {
            position: absolute;
            width: 110px;
            height: 3px;
            background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0));
            border-radius: 999px;
            transform: rotate(-38deg);
            opacity: 0;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
            animation: shootAcross var(--shoot-dur, 9s) infinite ease-out;
            animation-delay: var(--shoot-delay, 1s);
        }
        @keyframes shootAcross {
            0% { opacity: 0; transform: translate(0, 0) rotate(-38deg) scaleX(0.4); }
            4% { opacity: 1; transform: translate(-90px, 70px) rotate(-38deg) scaleX(1); }
            10% { opacity: 0; transform: translate(-220px, 170px) rotate(-38deg) scaleX(0.2); }
            100% { opacity: 0; transform: translate(-220px, 170px) rotate(-38deg) scaleX(0.2); }
        }

        /* Giant Dusty-Pink Textured Moon */
        .giant-moon {
            position: absolute;
            top: 7vh;
            left: 50%;
            transform: translateX(-50%);
            width: min(34vw, 310px);
            height: min(34vw, 310px);
            border-radius: 50%;
            background: radial-gradient(circle at 38% 35%, #caa0be 0%, var(--moon-base) 55%, #9f6f95 100%);
            box-shadow: 0 0 90px 25px rgba(196, 142, 180, 0.22);
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            animation: moonFloat 14s infinite alternate ease-in-out;
        }
        @keyframes moonFloat {
            0% { transform: translate(-50%, 0px); }
            100% { transform: translate(-50%, -8px); }
        }

        /* Parallax City Silhouettes & Glowing Windows */
        .city-backdrop {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75vh;
            pointer-events: none;
            z-index: 3;
        }

        .window-light {
            transition: opacity 1.8s ease-in-out, fill 1.8s ease;
        }
        .window-dim {
            opacity: 0.12 !important;
        }

        /* ==========================================
           MINIMALIST FLOATING GLASS HUD (NO CLUTTER)
           ========================================== */
        .top-hud {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 22px;
            gap: 12px;
            pointer-events: none;
        }

        /* Sleek Pill Bar inspired by the clean search bar in screenshot */
        .control-pill {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.94);
            color: #231630;
            height: 50px;
            padding: 0 10px 0 22px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 12px 36px rgba(14, 7, 24, 0.45);
            backdrop-filter: blur(12px);
            max-width: 94vw;
        }

        .brand-title {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.01em;
            color: #2b193d;
            white-space: nowrap;
        }

        .divider-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #b5a4c4;
        }

        .time-readout {
            font-size: 0.92rem;
            font-weight: 600;
            color: #4a3563;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-readout strong {
            color: #1f1130;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .pill-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }

        .pill-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #523c6b;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .pill-btn:hover:not(:disabled) {
            background: rgba(83, 54, 102, 0.1);
            color: #1f1130;
        }

        .pill-btn.active-mode {
            background: #2b193d;
            color: #ffffff;
        }

        .pill-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* Secondary Floating Dark Action Pill (Cross Bridge Button) */
        .action-row {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
        }

        .cross-pill-btn {
            background: rgba(27, 18, 40, 0.86);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 26px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            transform: translateY(-6px) scale(0.96);
            pointer-events: none;
        }

        .cross-pill-btn.ready {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            border-color: rgba(255, 207, 124, 0.65);
            box-shadow: 0 8px 28px rgba(255, 184, 92, 0.28);
        }

        .cross-pill-btn.ready:hover {
            background: #2d1d42;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 32px rgba(255, 184, 92, 0.4);
        }

        /* ==========================================
           BRIDGE & ROOFTOP LEDGE STAGE
           ========================================== */
        .stage-area {
            position: relative;
            z-index: 20;
            width: 100%;
            height: 50vh;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-bottom: 58px;
        }

        /* Left & Right Rooftop Cliffs */
        .rooftop-ledge {
            position: relative;
            width: 31vw;
            height: 120px;
            background: linear-gradient(180deg, #1b1029 0%, #0e0717 100%);
            border-top: 3px solid #482e61;
            z-index: 15;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .rooftop-ledge.left-ledge {
            border-top-right-radius: 14px;
            box-shadow: 10px 0 35px rgba(0, 0, 0, 0.6);
        }

        .rooftop-ledge.right-ledge {
            border-top-left-radius: 14px;
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.6);
        }

        /* Architectural Chimney / Railing Detail on Ledges */
        .ledge-label {
            position: absolute;
            bottom: 16px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(203, 186, 212, 0.4);
            pointer-events: none;
        }

        /* Characters Container Standing on the Rooftop */
        .bank-crowd {
            position: absolute;
            bottom: 118px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: clamp(8px, 2vw, 24px);
            width: 100%;
            padding: 0 12px;
            z-index: 25;
        }

        /* Suspension Bridge Spanning the Canyon */
        .bridge-span {
            position: relative;
            flex: 1;
            height: 120px;
            display: flex;
             flex-direction: column;
            justify-content: flex-start;
            z-index: 14;
        }

        /* Catenary Suspension Cables */
        .bridge-cable-svg {
            position: absolute;
            top: -52px;
            left: 0;
            width: 100%;
            height: 60px;
            pointer-events: none;
            overflow: visible;
        }

        .bridge-deck {
            position: relative;
            width: 100%;
            height: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            padding: 0 4px;
            transform-origin: center center;
            transition: transform 0.25s ease;
        }

        .bridge-deck.swaying {
            animation: deckSway 0.42s infinite alternate ease-in-out;
        }
        @keyframes deckSway {
            0% { transform: translateY(0px); }
            100% { transform: translateY(3.5px); }
        }

        .plank {
            flex: 1;
            height: 8px;
            background: #3d2449;
            border-top: 2px solid #6b4475;
            border-radius: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Moving Lantern Pool of Light on Bridge */
        .bridge-glow-pool {
            position: absolute;
            top: -45px;
            width: 130px;
            height: 90px;
            background: radial-gradient(circle, rgba(255, 205, 112, 0.35) 0%, rgba(255, 160, 80, 0) 72%);
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%);
            transition: opacity 0.3s ease;
        }

        /* ==========================================
           LIVING, BREATHING CHARACTER AVATARS
           ========================================== */
        .living-person {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
            transform-origin: bottom center;
        }

        .living-person.inactive-side {
            cursor: default;
            opacity: 0.68;
        }

        .living-person:hover:not(.inactive-side) {
            transform: translateY(-6px);
        }

        .living-person.selected {
            transform: translateY(-12px) scale(1.05);
        }

        /* Minimal Floating Speed Tag Above Head */
        .speed-pill {
            font-size: 0.73rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(22, 12, 33, 0.78);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.14);
            margin-bottom: 6px;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .living-person.selected .speed-pill {
            background: var(--accent-warm);
            color: #1d102b;
            border-color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 207, 124, 0.7);
        }

        /* Selection Ground Halo */
        .foot-halo {
            position: absolute;
            bottom: -4px;
            width: 38px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 207, 124, 0.85) 0%, rgba(255, 207, 124, 0) 75%);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .living-person.selected .foot-halo {
            opacity: 1;
        }

        /* Living Idle Animations (Breathing, Blinking, Scarf Sway) */
        .avatar-svg {
            overflow: visible;
            filter: drop-shadow(0 6px 12px rgba(10, 5, 18, 0.65));
        }

        .idle-breathe {
            animation: breathe Torso var(--breathe-dur, 3.2s) infinite ease-in-out;
            transform-origin: center bottom;
        }
        @keyframes breathe {
            0%, 100% { transform: scaleY(1) translateY(0); }
            50% { transform: scaleY(1.03) translateY(-1.5px); }
        }

        .idle-head {
            animation: headTilt var(--head-dur, 4.5s) infinite ease-in-out;
            transform-origin: 24px 26px;
        }
        @keyframes headTilt {
            0%, 100% { transform: rotate(-1.5deg); }
            50% { transform: rotate(2deg) translateY(-1px); }
        }

        .eye-blink {
            animation: blinkEyes var(--blink-dur, 5s) infinite;
            transform-origin: center;
        }
        @keyframes blinkEyes {
            0%, 92%, 96%, 100% { transform: scaleY(1); }
            94% { transform: scaleY(0.1); }
        }

        .scarf-wave {
            animation: scarfBreeze 2.6s infinite alternate ease-in-out;
            transform-origin: left center;
        }
        @keyframes scarfBreeze {
            0% { transform: rotate(-4deg) skewX(0deg); }
            100% { transform: rotate(7deg) skewX(6deg); }
        }

        /* Active Walking Articulation on Bridge */
        .bridge-walkers-layer {
            position: absolute;
            bottom: 118px;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            z-index: 28;
        }

        .walking-party {
            position: absolute;
            bottom: 0;
            display: flex;
            align-items: flex-end;
            gap: 14px;
            opacity: 0;
            transform: translateX(-50%);
            will-change: left, transform;
        }

        .walking-party.facing-left .avatar-svg {
            transform: scaleX(-1);
        }

        .walking-stride-body {
            animation: walkBob 0.32s infinite alternate ease-in-out;
        }
        @keyframes walkBob {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        .walking-leg-front {
            animation: strideFront 0.32s infinite alternate ease-in-out;
            transform-origin: 24px 54px;
        }
        .walking-leg-back {
            animation: strideBack 0.32s infinite alternate ease-in-out;
            transform-origin: 24px 54px;
        }
        .walking-arm-front {
            animation: armSwingFront 0.32s infinite alternate ease-in-out;
            transform-origin: 24px 34px;
        }
        .walking-arm-back {
            animation: armSwingBack 0.32s infinite alternate ease-in-out;
            transform-origin: 24px 34px;
        }

        @keyframes strideFront {
            0% { transform: rotate(-26deg); }
            100% { transform: rotate(26deg); }
        }
        @keyframes strideBack {
            0% { transform: rotate(26deg); }
            100% { transform: rotate(-26deg); }
        }
        @keyframes armSwingFront {
            0% { transform: rotate(22deg); }
            100% { transform: rotate(-22deg); }
        }
        @keyframes armSwingBack {
            0% { transform: rotate(-18deg); }
            100% { transform: rotate(22deg); }
        }

        /* Warm Lantern Carrier Item */
        .lantern-carrier {
            position: absolute;
            bottom: 32px;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 29;
        }

        .lantern-aura {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 214, 133, 0.9) 0%, rgba(255, 158, 88, 0.35) 45%, rgba(255, 140, 80, 0) 72%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: lanternPulse 2.2s infinite alternate ease-in-out;
        }
        @keyframes lanternPulse {
            0% { transform: scale(0.92); opacity: 0.88; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        .lantern-core {
            width: 12px;
            height: 16px;
            border-radius: 4px;
            background: #fff6d6;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 16px 4px #fbbf24;
        }

        /* ==========================================
           SUBTLE BOTTOM HINT PILL & WATER REFLECTION
           ========================================== */
        .bottom-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            width: 92vw;
            display: flex;
            justify-content: center;
        }

        .status-whisper {
            pointer-events: auto;
            background: rgba(20, 12, 32, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-muted);
            padding: 7px 20px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            backdrop-filter: blur(8px);
            text-align: center;
            transition: all 0.3s ease;
        }

        .status-whisper.win-state {
            background: rgba(22, 68, 56, 0.88);
            border-color: rgba(110, 231, 183, 0.5);
            color: #d1fae5;
        }

        .status-whisper.lose-state {
            background: rgba(76, 23, 43, 0.88);
            border-color: rgba(253, 164, 175, 0.5);
            color: #ffe4e6;
        }

        /* Water Shimmer Reflection at Very Bottom Edge */
        .river-reflection {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 58px;
            background: linear-gradient(180deg, rgba(46, 28, 68, 0.78) 0%, rgba(22, 13, 36, 0.96) 100%);
            border-top: 1px solid rgba(184, 135, 171, 0.25);
            z-index: 18;
            overflow: hidden;
        }

        .reflection-ripple {
            position: absolute;
            height: 2px;
            border-radius: 999px;
            background: rgba(255, 207, 124, 0.22);
            animation: rippleDrift 6s infinite alternate ease-in-out;
        }
        @keyframes rippleDrift {
            0% { transform: translateX(-12px); opacity: 0.2; }
            100% { transform: translateX(12px); opacity: 0.55; }
        }

        @media (max-width: 700px) {
            .control-pill {
                height: auto;
                padding: 10px 16px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                border-radius: 24px;
            }
            .brand-title {
                display: none;
            }
            .divider-dot {
                display: none;
            }
            .rooftop-ledge {
                width: 34vw;
            }
        }
    </style>
</head>
<body>

<div class="world-viewport">

    <!-- 1. SKY LAYER: TWINKLING STARS & DIAGONAL SHOOTING STARS -->
    <div id="sky-canvas" class="sky-canvas"></div>

    <!-- 2. GIANT TEXTURED DUSTY-PINK MOON (Exact match to screenshot) -->
    <div class="giant-moon">
        <svg viewBox="0 0 200 200" width="100%" height="100%" opacity="0.42">
            <path fill="#87587e" d="M110,20 C135,28 155,45 148,72 C140,98 115,85 98,105 C81,125 95,155 72,162 C48,168 35,140 48,118 C60,96 42,78 58,55 C74,32 85,12 110,20 Z"/>
            <circle cx="65" cy="145" r="14" fill="#87587e"/>
            <circle cx="145" cy="115" r="22" fill="#87587e"/>
            <circle cx="125" cy="155" r="10" fill="#87587e"/>
        </svg>
    </div>

    <!-- 3. PARALLAX CITY ROOFTOPS & FLICKERING WARM WINDOWS -->
    <svg class="city-backdrop" viewBox="0 0 1440 520" preserveAspectRatio="xMidYMax slice">
        <!-- Distant Lavender-Purple Skyline -->
        <path fill="#613b6d" opacity="0.7" d="M0,520 L0,270 L65,270 L65,240 L140,240 L140,290 L210,290 L210,210 L295,210 L295,265 L380,265 L380,225 L470,225 L470,285 L560,285 L560,195 L660,195 L660,270 L780,270 L780,215 L870,215 L870,260 L960,260 L960,185 L1060,185 L1060,255 L1170,255 L1170,220 L1270,220 L1270,275 L1360,275 L1360,235 L1440,235 L1440,520 Z"/>

        <!-- Midground Plum European Rooftops & Chimneys -->
        <path fill="#3e2551" d="M0,520 L0,310 L45,280 L90,310 L90,350 L155,350 L155,255 L175,255 L175,235 L195,235 L195,255 L265,255 L265,330 L345,330 L395,285 L445,330 L445,365 L525,365 L525,270 L620,270 L620,355 L820,355 L820,245 L860,210 L995,210 L1035,245 L1035,345 L1115,345 L1115,275 L1215,275 L1215,335 L1295,335 L1340,290 L1385,335 L1440,335 L1440,520 Z"/>

        <!-- Foreground Deep Violet Apartments -->
        <path fill="#261636" d="M0,520 L0,365 L80,365 L125,325 L170,365 L170,410 L250,410 L250,305 L360,305 L360,395 L460,395 L460,340 L550,340 L550,520 L890,520 L890,265 L1010,265 L1010,360 L1130,360 L1130,315 L1240,315 L1240,385 L1335,385 L1335,345 L1440,345 L1440,520 Z"/>

        <!-- Cozy Glowing Apartment Windows (Warm Gold, Coral Pink, Soft Cream) -->
        <g id="city-windows">
            <!-- Left Cluster -->
            <rect class="window-light" x="172" y="275" width="12" height="22" rx="6" fill="#ffdf8e"/>
            <rect class="window-light" x="192" y="275" width="12" height="22" rx="6" fill="#ffdf8e"/>
            <rect class="window-light" x="212" y="275" width="12" height="22" rx="6" fill="#ff9eb5"/>
            <rect class="window-light" x="272" y="325" width="14" height="24" rx="3" fill="#ffcf7c"/>
            <rect class="window-light" x="296" y="325" width="14" height="24" rx="3" fill="#ffdf8e"/>
            <rect class="window-light" x="272" y="362" width="14" height="24" rx="3" fill="#ff8da1"/>
            <rect class="window-light" x="482" y="362" width="12" height="20" rx="2" fill="#ffdf8e"/>
            <rect class="window-light" x="502" y="362" width="12" height="20" rx="2" fill="#ffcf7c"/>

            <!-- Right Cluster (Matches the tall building in user screenshot) -->
            <rect class="window-light" x="912" y="290" width="16" height="26" rx="8" fill="#ff8da1"/>
            <rect class="window-light" x="942" y="290" width="16" height="26" rx="8" fill="#ffdf8e"/>
            <rect class="window-light" x="972" y="290" width="16" height="26" rx="8" fill="#ff8da1"/>

                <line x1="230" y1="36" x2="230" y2="54" stroke="#492e59" stroke-width="1.5"/>
                <line x1="290" y1="30" x2="290" y2="54" stroke="#492e59" stroke-width="1.5"/>

    <!-- 6. MINIMALIST BOTTOM STATUS WHISPER & WATER SHIMMER -->
    <div class="bottom-bar">

            Tap 1 or 2 travelers on the lantern side to cross the bridge

        <div class="reflection-ripple" style="width: 75px; top: 40px; left: 72%; animation-delay: 2.8s;"></div>
    </div>

</div>

<script>
    /* ==========================================
       1. PROCEDURAL SKY & LIVING WINDOWS
       ========================================== */
    function initSkyAndWindows() {
        const sky = document.getElementById('sky-canvas');
        sky.innerHTML = '';

        // Create crisp white & soft cyan stars like the reference image
        const starColors = ['#ffffff', '#ffffff', '#7dd3fc', '#f5d0fe'];
        for (let i = 0; i < 38; i++) {
            const star = document.createElement('div');
            star.className = 'star-dot';
            const size = Math.random() > 0.78 ? 5 : 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 96 + 2}%`;
            star.style.top = `${Math.random() * 52 + 3}%`;
            star.style.background = starColors[i % starColors.length];
            star.style.setProperty('--dur', `${2.5 + Math.random() * 4}s`);
            if (size === 5) {
                star.style.boxShadow = `0 0 8px ${star.style.background}`;
            }
            sky.appendChild(star);
        }

        // Create 3 diagonal shooting meteors
        const meteorCoords = [
            { top: '8%', left: '36%', delay: '0.5s', dur: '8s' },
            { top: '18%', left: '84%', delay: '4.2s', dur: '11s' },
            { top: '12%', left: '64%', delay: '7.5s', dur: '9.5s' }
        ];
        meteorCoords.forEach(m => {
            const streak = document.createElement('div');
            streak.className = 'shooting-star';
            streak.style.top = m.top;
            streak.style.left = m.left;
            streak.style.setProperty('--shoot-delay', m.delay);
            streak.style.setProperty('--shoot-dur', m.dur);
            sky.appendChild(streak);
        });

        // Gently flicker apartment windows on and off
        const windows = document.querySelectorAll('#city-windows .window-light');
        setInterval(() => {
            const randomWin = windows[Math.floor(Math.random() * windows.length)];
            if (randomWin) {
                randomWin.classList.toggle('window-dim');
            }
        }, 2200);
    }

    /* ==========================================
       2. WEB AUDIO SYNTHESIZER (FOOTSTEPS & AMBIENT CHORDS)
       ========================================== */
    let audioCtx = null;
    let soundOn = true;
    let droneStarted = false;
    let droneGain = null;

    function ensureAudio() {
        if (!audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (audioCtx && soundOn && !droneStarted) {
            startTwilightDrone();
        }
    }

    function startTwilightDrone() {
        if (!audioCtx || droneStarted) return;
        droneStarted = true;
        droneGain = audioCtx.createGain();
        droneGain.gain.value = 0.018;
        droneGain.connect(audioCtx.destination);

        // Warm dreamy twilight chord (F#m7 / Dmaj9 feel)
        [146.83, 220.0, 277.18, 329.63].forEach(freq => {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(droneGain);
            osc.start();
        });
    }

    function toggleAudio() {
        soundOn = !soundOn;
        const btn = document.getElementById('audio-btn');
        btn.textContent = soundOn ? 'Sound On' : 'Muted';
        if (droneGain && audioCtx) {
            droneGain.gain.setTargetAtTime(soundOn ? 0.018 : 0.0001, audioCtx.currentTime, 0.2);
        }
    }

    function playTone(type, stepIdx = 0) {
        if (!soundOn) return;
        try {
            ensureAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'select') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(540, now);
                osc.frequency.exponentialRampToValueAtTime(720, now + 0.08);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            } else if (type === 'footstep') {
                // Soft wooden plank step + subtle melody note
                const pentatonic = [293.66, 329.63, 369.99, 440.0, 493.88, 587.33];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(130 + (stepIdx % 2) * 28, now);
                osc.frequency.exponentialRampToValueAtTime(48, now + 0.08);
                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.09);

                // Gentle kalimba-like pluck on every second step
                if (stepIdx % 2 === 0) {
                    const pluck = audioCtx.createOscillator();
                    const pGain = audioCtx.createGain();
                    pluck.type = 'sine';
                    pluck.frequency.setValueAtTime(pentatonic[(stepIdx / 2) % pentatonic.length], now);
                    pGain.gain.setValueAtTime(0.035, now);
                    pGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    pluck.connect(pGain).connect(audioCtx.destination);
                    pluck.start(now);
                    pluck.stop(now + 0.23);
                }
            } else if (type === 'win') {
                [440, 554.37, 659.25, 880].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.12);
                    gain.gain.setValueAtTime(0.09, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.42);
                });
            } else if (type === 'lose') {
                [329.63, 293.66, 246.94].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.16);
                    gain.gain.setValueAtTime(0.08, now + i * 0.16);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.35);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(now + i * 0.16);
                    osc.stop(now + i * 0.16 + 0.36);
                });
            }
        } catch (e) {}
    }

    /* ==========================================
       3. LIVING CHARACTERS & PUZZLE STATE
       ========================================== */
    const MODES = {
        classic: { limit: 17, times: [1, 2, 5, 10] },
        variant: { limit: 15, times: [1, 2, 5, 8] }
    };

    const CHARACTER_STYLES = [
        { id: 'A', coat: '#38bdf8', scarf: '#bae6fd', heightScale: 0.92, breathe: '2.6s', blink: '4.2s' },
        { id: 'B', coat: '#34d399', scarf: '#a7f3d0', heightScale: 0.98, breathe: '3.1s', blink: '5.5s' },
        { id: 'C', coat: '#fbbf24', scarf: '#fde68a', heightScale: 1.03, breathe: '3.6s', blink: '4.8s' },
        { id: 'D', coat: '#f472b6', scarf: '#fbcfe8', heightScale: 1.08, breathe: '4.2s', blink: '6.1s' }
    ];

    let currentMode = 'classic';
    let state = {
        limit: 17,
        elapsed: 0,
        torchSide: 'left',
        selected: [],
        isWalking: false,
        travelers: [],
        history: []
    };

    // Build SVG for a Living Character (idle or walking)
    function createLivingAvatarSVG(char, isWalking = false) {
        const bodyClass = isWalking ? 'walking-stride-body' : 'idle-breathe';
        const legFrontClass = isWalking ? 'walking-leg-front' : '';
        const legBackClass = isWalking ? 'walking-leg-back' : '';
        const armFrontClass = isWalking ? 'walking-arm-front' : '';
        const armBackClass = isWalking ? 'walking-arm-back' : '';

        return `
            <svg class="avatar-svg" width="48" height="78" viewBox="0 0 48 78"
                 style="--breathe-dur:${char.breathe}; --blink-dur:${char.blink}; transform: scale(${char.heightScale}); transform-origin: bottom center;">
                <g class="${bodyClass}">
                    <!-- Back Arm -->
                    <line class="${armBackClass}" x1="24" y1="34" x2="16" y2="50" stroke="#2c1b3d" stroke-width="4.5" stroke-linecap="round"/>

                    <!-- Back Leg -->
                    <line class="${legBackClass}" x1="22" y1="53" x2="19" y2="74" stroke="#190e26" stroke-width="5" stroke-linecap="round"/>

                    <!-- Front Leg -->
                    <line class="${legFrontClass}" x1="26" y1="53" x2="29" y2="74" stroke="#2d1a42" stroke-width="5" stroke-linecap="round"/>

                    <!-- Flowing Coat / Torso -->
                    <path d="M16,31 C16,28 32,28 32,31 L35,55 C35,57 13,57 13,55 Z" fill="${char.coat}"/>

                    <!-- Swaying Breeze Scarf -->
                    <path class="scarf-wave" d="M18,29 Q24,33 31,29 L38,34 Q30,38 20,33 Z" fill="${char.scarf}"/>

                    <!-- Expressive Tilting Head -->
                    <g class="idle-head">
                        <circle cx="24" cy="18" r="9.5" fill="#fce7f3"/>
                        <!-- Blinking Eyes -->
                        <g class="eye-blink">
                            <circle cx="21.5" cy="17.5" r="1.4" fill="#1e102b"/>
                            <circle cx="27.5" cy="17.5" r="1.4" fill="#1e102b"/>
                        </g>
                        <!-- Cozy Night Hat / Hood -->
                        <path d="M14.5,16 C15,8 33,8 33.5,16 Z" fill="${char.coat}"/>
                    </g>

                    <!-- Front Arm -->
                    <line class="${armFrontClass}" x1="24" y1="34" x2="31" y2="50" stroke="${char.coat}" stroke-width="4.5" stroke-linecap="round"/>
                </g>
            </svg>
        `;
    }

    function switchMode(modeKey) {
        if (state.isWalking) return;
        currentMode = modeKey;
        document.getElementById('mode-17').classList.toggle('active-mode', modeKey === 'classic');
        document.getElementById('mode-15').classList.toggle('active-mode', modeKey === 'variant');
        resetGame();
    }

    function resetGame() {
        if (state.isWalking) return;
        const cfg = MODES[currentMode];
        state = {
            limit: cfg.limit,
            elapsed: 0,
            torchSide: 'left',
            selected: [],
            isWalking: false,
            travelers: CHARACTER_STYLES.map((style, i) => ({
                ...style,
                time: cfg.times[i],
                side: 'left'
            })),
            history: []
        };
        renderScene();
    }

    function toggleTraveler(id) {
        if (state.isWalking) return;
        const person = state.travelers.find(t => t.id === id);
        if (!person || person.side !== state.torchSide) return;

        // Prevent moves if game already ended
        const allRight = state.travelers.every(t => t.side === 'right');
        if (allRight || state.elapsed >= state.limit) return;

        const idx = state.selected.indexOf(id);
        if (idx > -1) {
            state.selected.splice(idx, 1);
            playTone('select');
        } else {
            if (state.selected.length >= 2) {
                state.selected.shift();
            }
            state.selected.push(id);
            playTone('select');
        }
        renderScene();
    }

    function triggerBridgeCrossing() {
        if (state.isWalking || state.selected.length === 0) return;
        state.isWalking = true;

        const fromSide = state.torchSide;
        const toSide = fromSide === 'left' ? 'right' : 'left';
        const movers = state.travelers.filter(t => state.selected.includes(t.id));
        const tripCost = Math.max(...movers.map(m => m.time));

        // Save undo snapshot
        state.history.push({
            elapsed: state.elapsed,
            torchSide: state.torchSide,
            sides: state.travelers.map(t => t.side)
        });

        // Hide selected characters on bank during their walk
        renderScene(movers.map(m => m.id));

        const partyEl = document.getElementById('walking-party');
        const lanternEl = document.getElementById('lantern-carrier');
        const glowPool = document.getElementById('bridge-glow');
        const deckEl = document.getElementById('bridge-deck');

        partyEl.className = `walking-party ${toSide === 'left' ? 'facing-left' : ''}`;
        partyEl.innerHTML = movers.map(m => `
            <div class="living-person">
                <span class="speed-pill">${m.time}m</span>
                ${createLivingAvatarSVG(m, true)}
            </div>
        `).join('');

        // Duration proportional to crossing speed (1.3s to 2.5s)
        const durationMs = Math.min(2500, 1150 + tripCost * 130);
        const startX = fromSide === 'left' ? 28 : 72;
        const endX = toSide === 'right' ? 72 : 28;

        partyEl.style.transition = 'none';
        partyEl.style.left = `${startX}vw`;
        partyEl.style.opacity = '1';
        deckEl.classList.add('swaying');
        glowPool.style.opacity = '1';

        // Footstep sound cadence
        let stepCount = 0;
        playTone('footstep', stepCount++);
        const stepTimer = setInterval(() => {
            playTone('footstep', stepCount++);
        }, 250);

        // Animate smooth walk across the bridge and move lantern + light pool
        const startTime = performance.now();
        function animateWalkFrame(now) {
            const progress = Math.min(1, (now - startTime) / durationMs);
            // Smooth ease-in-out
            const eased = progress < 0.5
                ? 2 * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;

            const currentVw = startX + (endX - startX) * eased;
            partyEl.style.left = `${currentVw}vw`;
            lanternEl.style.left = `calc(${currentVw}vw - 28px)`;
            glowPool.style.left = `${eased * 100}%`;

            if (progress < 1) {
                requestAnimationFrame(animateWalkFrame);
            } else {
                clearInterval(stepTimer);
                partyEl.style.opacity = '0';
                deckEl.classList.remove('swaying');
                glowPool.style.opacity = '0';

                movers.forEach(m => { m.side = toSide; });
                state.elapsed += tripCost;
                state.torchSide = toSide;
                state.selected = [];
                state.isWalking = false;

                const won = state.travelers.every(t => t.side === 'right') && state.elapsed <= state.limit;
                const lost = state.elapsed > state.limit || (!won && state.elapsed === state.limit);
                if (won) playTone('win');
                else if (lost) playTone('lose');

                renderScene();
            }
        }
        requestAnimationFrame(animateWalkFrame);
    }

    function undoMove() {
        if (state.isWalking || state.history.length === 0) return;
        const last = state.history.pop();
        state.elapsed = last.elapsed;
        state.torchSide = last.torchSide;
        state.travelers.forEach((t, idx) => {
            t.side = last.sides[idx];
        });
        state.selected = [];
        playTone('select');
        renderScene();
    }

    function renderScene(hiddenIds = []) {
        document.getElementById('elapsed-num').textContent = state.elapsed;
        document.getElementById('limit-num').textContent = state.limit;
        document.getElementById('undo-btn').disabled = state.isWalking || state.history.length === 0;

        // Render Left and Right Rooftop Crowds
        const leftCrowd = document.getElementById('left-crowd');
        const rightCrowd = document.getElementById('right-crowd');

        const renderBankPerson = (t) => {
            if (hiddenIds.includes(t.id)) return '';
            const isSelected = state.selected.includes(t.id);
            const isTorchHere = t.side === state.torchSide && !state.isWalking;
            return `
                <div class="living-person ${isSelected ? 'selected' : ''} ${!isTorchHere ? 'inactive-side' : ''}"
                     onclick="toggleTraveler('${t.id}')">
                    <span class="speed-pill">${t.time}m</span>
                    ${createLivingAvatarSVG(t, false)}
                    <div class="foot-halo"></div>
                </div>
            `;
        };

        leftCrowd.innerHTML = state.travelers.filter(t => t.side === 'left').map(renderBankPerson).join('');
        rightCrowd.innerHTML = state.travelers.filter(t => t.side === 'right').map(renderBankPerson).join('');

        // Position Lantern on Active Rooftop Ledge when idle
        const lanternEl = document.getElementById('lantern-carrier');
        if (!state.isWalking) {
            lanternEl.style.left = state.torchSide === 'left' ? '26vw' : '70vw';
        }

        // Update Floating Cross Action Button
        const crossBtn = document.getElementById('cross-btn');
        if (!state.isWalking && state.selected.length > 0) {
            const movers = state.travelers.filter(t => state.selected.includes(t.id));
            const pace = Math.max(...movers.map(m => m.time));
            const dirLabel = state.torchSide === 'left' ? 'Cross East' : 'Return West';
            crossBtn.textContent = `${dirLabel} · ${pace} min`;
            crossBtn.classList.add('ready');
        } else {
            crossBtn.classList.remove('ready');
        }

        // Update Subtle Bottom Whisper Bar
        const whisper = document.getElementById('status-whisper');
        const allAcross = state.travelers.every(t => t.side === 'right');

        whisper.className = 'status-whisper';
        if (allAcross && state.elapsed <= state.limit) {
            whisper.classList.add('win-state');
            whisper.textContent = `All travelers reached the East Sanctuary in ${state.elapsed} minutes`;
        } else if (state.elapsed > state.limit || (!allAcross && state.elapsed === state.limit)) {
            whisper.classList.add('lose-state');
            whisper.textContent = `The lantern faded at ${state.elapsed} minutes — use Undo or Reset to try again`;
        } else if (state.selected.length > 0) {
            const movers = state.travelers.filter(t => state.selected.includes(t.id));
            const pace = Math.max(...movers.map(m => m.time));
            whisper.textContent = `Selected ${movers.map(m => m.time + 'm').join(' & ')} — crossing together at ${pace}m pace`;
        } else {
            whisper.textContent = state.torchSide === 'left'
                ? 'Tap 1 or 2 travelers on the West Rooftop to cross with the lantern'
                : 'Tap 1 or 2 travelers on the East Sanctuary to bring the lantern back';
        }
    }

    window.onload = function () {
        initSkyAndWindows();
        resetGame();
    };
</script>
</body>
